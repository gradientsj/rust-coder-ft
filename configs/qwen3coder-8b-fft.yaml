# Full BF16 fine-tune of Qwen/Qwen3-8B on the Rust mix — primary config.
#
# Hardware target: 4x H100 80GB SXM, fully NVLinked (NV18, Phase 0) ->
# FSDP2 full-shard with reshard_after_forward is cheap; no hybrid sharding
# needed. Launch: train/train.sh configs/qwen3coder-8b-fft.yaml
#
# Memory budget (8B, full FT, FSDP across 4 GPUs): bf16 params 16GB + bf16
# grads 16GB + fp32 master/moments 96GB = 128GB total -> ~32GB/GPU sharded,
# leaving ~45GB for activations (seq 4096, micro_batch 2, act-ckpt on).
#
# NOTE on the base model: there is no dense 7-8B Qwen3-Coder on the Hub
# (verified 2026-06-04; that family is MoE-only). Qwen3-8B dense is the
# chosen base; this project supplies the code specialization.

base_model: Qwen/Qwen3-8B
trust_remote_code: false

chat_template: tokenizer_default     # Qwen3 ChatML, incl. empty <think></think>
                                     # in assistant turns (non-thinking mode);
                                     # SFT format == inference format

datasets:
  - path: data/splits/train_chat.jsonl
    type: chat_template
    field_messages: messages
  - path: data/splits/train_completion.jsonl
    type: completion

test_datasets:
  - path: data/splits/val_chat.jsonl
    type: chat_template
    field_messages: messages
    split: train

dataset_prepared_path: data/work/prepared
output_dir: outputs/qwen3-8b-fft
seed: 17

sequence_len: 4096                   # raise to 8192 only after memory headroom
sample_packing: true                 # is confirmed at steady state
eval_sample_packing: false
pad_to_sequence_len: true

# 2 micro x 4 GPUs x 8 accum = 64 seqs (~256k tokens) effective batch
micro_batch_size: 2
gradient_accumulation_steps: 8
num_epochs: 2

optimizer: adamw_torch_fused
learning_rate: 1.5e-5                # full-FT range 1e-5..2e-5; higher torches
lr_scheduler: cosine                 # instruction-following fast
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0

bf16: true
tf32: true
flash_attention: true

# FP8 matmuls (H100): axolotl's supported path is torchao float8, not
# Transformer Engine — TE stays in this repo for the FP8 *export* (Phase 5).
# Flip both to true for the FP8 throughput experiment after the BF16 run is
# proven; keep the loss curves comparable before trusting it.
fp8: false
fp8_enable_fsdp_float8_all_gather: false

fsdp_version: 2
fsdp_config:
  offload_params: false              # fits without offload; keep comms on NVLink
  cpu_ram_efficient_loading: true
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: Qwen3DecoderLayer
  reshard_after_forward: true        # FULL_SHARD semantics; cheap over NV18
  activation_checkpointing: true
  state_dict_type: FULL_STATE_DICT
  final_state_dict_type: FULL_STATE_DICT

# frequent early checkpoints: full FT can diverge early and we want rollback
# points; prune old ones aggressively to bound disk
save_steps: 25
save_total_limit: 8
eval_steps: 25
logging_steps: 1

wandb_project: rust-coder-ft
wandb_name: qwen3-8b-fft

special_tokens: {}
