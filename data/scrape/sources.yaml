# Expanded 2026-06-04: curated allowlist + crates.io top-200 by downloads.
# License filter remains the hard gate; non-permissive crates are rejected
# at harvest time and counted in harvest_stats.json.
license_allowlist:
- MIT
- Apache-2.0
- BSD-2-Clause
- BSD-3-Clause
harvest:
  max_files_per_crate: 300
  include_dirs:
  - src
  - examples
  - tests
  - benches
  exclude_path_substrings:
  - /target/
  - /vendor/
  - /third_party/
  rate_limit_seconds: 1.0
  user_agent: rust-coder-ft data pipeline (stanleyjacobai@gmail.com)
